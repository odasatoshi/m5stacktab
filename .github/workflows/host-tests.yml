name: host tests

# 実機が要らないテストは CI で回す。実機での Reality Check は PR のチェックリストで担保する。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WireGuard の暗号テストは mbedTLS 3.x を使う（4.x では ChaCha20-Poly1305 が private API）。
      - name: install mbedtls
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          dpkg -s libmbedtls-dev | grep -i version

      # Linux では AddressSanitizer も併用する（macOS の開発機では起動時に固まるため外している）。
      - name: vt100 core
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
              -o /tmp/test_vt100 components/vt100/test_vt100.cpp components/vt100/vt100.cpp
          /tmp/test_vt100

      - name: ime (romaji, dictionary)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
              -o /tmp/test_ime components/ime/test_ime.cpp components/ime/romaji.cpp \
              components/ime/skk_dict.cpp
          /tmp/test_ime

      - name: ime (state machine, flick keyboard)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
              -o /tmp/test_flick components/ime/test_flick.cpp components/ime/ime.cpp \
              components/ime/flick.cpp components/ime/romaji.cpp components/ime/skk_dict.cpp
          /tmp/test_flick

      - name: wireguard crypto
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
              -I components/wg -o /tmp/test_noise components/wg/test_noise.cpp \
              components/wg/noise.cpp components/wg/blake2s.cpp \
              components/wg/crypto_mbedtls.cpp components/wg/transport.cpp -lmbedcrypto
          /tmp/test_noise

      # 辞書ビルドスクリプトが壊れていないかを小さい辞書で確認する（ネットワークは使わない）。
      - name: dictionary builder
        run: |
          printf ';; test\nにほん /日本/二本/\nかんじ /漢字/\n' | iconv -f utf-8 -t euc-jp > /tmp/jisyo
          python3 tools/build_dict.py --src /tmp/jisyo --out /tmp/dict.bin
          test -s /tmp/dict.bin

  build-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: build for esp32p4
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build
